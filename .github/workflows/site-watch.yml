# Site watch: every half hour, opens the live site's main pages (all three
# languages), the site editor's sign-in and the AI connector's sign-in
# metadata. If any fails twice in a row, it opens an issue labelled
# "site-down" — GitHub emails the repository's watchers — and closes it,
# with the time, once everything answers again. Free on a public repository.
#
# The address is the repository variable SITE_URL, or the vercel.app
# address, which keeps working (forwarding) once the Foundation's own
# domain is attached.
name: Site watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Open the site's pages
        id: check
        env:
          SITE: ${{ vars.SITE_URL || 'https://assf-website.vercel.app' }}
        run: |
          failed=""
          for path in / /hi /kn /about /manuscript-conservation /impact /trustees /editor/sign-in /.well-known/oauth-authorization-server; do
            ok=""
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 -A "ASSF site watch" "$SITE$path" || true)
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then ok=1; break; fi
              sleep 20
            done
            if [ -z "$ok" ]; then failed="$failed\n- \`$path\` answered ${code:-nothing}"; fi
          done
          {
            echo "failed<<EOF"
            printf "%b\n" "$failed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then printf "Not answering:%b\n" "$failed"; else echo "Every page answered."; fi

      - name: Open or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ steps.check.outputs.failed }}
          SITE: ${{ vars.SITE_URL || 'https://assf-website.vercel.app' }}
        run: |
          now=$(TZ=Asia/Kolkata date "+%-d %b %Y, %-I:%M %p IST")
          open=$(gh issue list --label site-down --state open --json number --jq '.[0].number')
          if [ -n "$(echo "$FAILED" | tr -d '[:space:]')" ]; then
            if [ -z "$open" ]; then
              gh label create site-down --color B60205 --description "The site watch found the website not answering" --force
              printf "The site watch couldn't open these pages of %s at %s (each tried twice):\n%s\n\nCheck the latest deployment on Vercel. This issue closes itself when the site answers again." "$SITE" "$now" "$FAILED" > body.md
              gh issue create --title "The website isn't answering ($now)" --label site-down --body-file body.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Answering again at $now."
          fi
